<body class="bg-gradient-to-b from-slate-950 via-blue-950 to-black text-white min-h-screen p-6">

<div class="max-w-4xl mx-auto text-center">

<div class="mt-8">

<div class="bg-green-600 rounded-3xl p-6 mt-8">
<h2 class="text-2xl font-bold">WhatsApp Orders</h2>
<a href="https://wa.me/94726198188"

class="w-full bg-cyan-500 p-4 rounded-2xl text-xl font-bold">
Order Now on WhatsApp
</button>
</div>

</div>

<script>
function orderNow() {
const uid = document.getElementById("uid").value;
const pack = document.getElementById("package").value;

window.open(
`https://wa.me/94726198188?text=EX.KAVIYA Order%0AUID: ${uid}%0APackage: ${pack}`,
